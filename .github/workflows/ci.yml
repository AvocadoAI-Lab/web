name: Public Portal CI

on:
  pull_request:
  push:
    branches: [main, codex/public-portal-mvp-ready]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-and-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - name: Start standalone preview and smoke-test routes
        shell: bash
        run: |
          set -euo pipefail

          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

          HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > /tmp/avocado-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/zh-Hant > /tmp/zh.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/avocado-preview.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/en > /tmp/en.html
          curl --fail --silent --show-error http://127.0.0.1:3000/zh-Hant/platform > /tmp/platform.html
          curl --fail --silent --show-error http://127.0.0.1:3000/en/solutions/healthcare-resilience > /tmp/solution.html
          grep -q 'Avocado.ai' /tmp/zh.html
          grep -q 'Avocado.ai' /tmp/en.html
          cat /tmp/avocado-preview.log
