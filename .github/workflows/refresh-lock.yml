name: Refresh secure package lock

on:
  push:
    branches: [codex/public-portal-mvp-ready]

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/public-portal-mvp-ready
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Generate a fresh lockfile from the minimal dependency set
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit the verified lockfile to the Codex branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "build: refresh secure package lock"
          git push origin HEAD:codex/public-portal-mvp-ready
